[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Proyecto de Machine Learning para analizar los viajes de MiBici mediante modelos de regresi\u00f3n, clasificaci\u00f3n y clustering, con ingesta reproducible, versionado de datos y seguimiento de experimentos en MLflow."
authors = [
  { name = "Equipo 47 - TC5061" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

